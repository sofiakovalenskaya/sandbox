<svg xmlns="http://www.w3.org/2000/svg" width="150.195402mm" height="37.758621mm" viewBox="0 0 1074 270"><title>Шахматный принт — верх и дно коробки</title><desc>Кремовый #FFF0D4 и светло-голубой #B9F8FC. Квадратная клетка. Два контура по фотографии, правый с прозрачной прорезью. Номинальная ширина каждой детали 73 мм; прочие пропорции восстановлены по фото. Без шрифтов, растровых изображений и розовых обводок.</desc><defs><clipPath id="bottom-flap-clip" clipPathUnits="userSpaceOnUse"><path d="M 15 0 H 507 L 522 102 V 270 H 0 V 102 Z" clip-rule="evenodd" fill-rule="evenodd" /></clipPath><clipPath id="top-flap-with-slot-clip" clipPathUnits="userSpaceOnUse"><path d="M 15 0 H 507 L 522 102 V 270 H 0 V 102 Z M 198 137 A 4 4 0 0 0 198 145 H 324 A 4 4 0 0 0 324 137 Z" clip-rule="evenodd" fill-rule="evenodd" /></clipPath></defs><g id="bottom-flap" transform="translate(0 0)"><path id="bottom-flap-base" d="M 15 0 H 507 L 522 102 V 270 H 0 V 102 Z" fill="#FFF0D4" fill-rule="evenodd" /><g id="bottom-flap-checker" clip-path="url(#bottom-flap-clip)" fill="#B9F8FC"><rect x="24" y="0" width="24" height="24" /><rect x="72" y="0" width="24" height="24" /><rect x="120" y="0" width="24" height="24" /><rect x="168" y="0" width="24" height="24" /><rect x="216" y="0" width="24" height="24" /><rect x="264" y="0" width="24" height="24" /><rect x="312" y="0" width="24" height="24" /><rect x="360" y="0" width="24" height="24" /><rect x="408" y="0" width="24" height="24" /><rect x="456" y="0" width="24" height="24" /><rect x="504" y="0" width="24" height="24" /><rect x="0" y="24" width="24" height="24" /><rect x="48" y="24" width="24" height="24" /><rect x="96" y="24" width="24" height="24" /><rect x="144" y="24" width="24" height="24" /><rect x="192" y="24" width="24" height="24" /><rect x="240" y="24" width="24" height="24" /><rect x="288" y="24" width="24" height="24" /><rect x="336" y="24" width="24" height="24" /><rect x="384" y="24" width="24" height="24" /><rect x="432" y="24" width="2