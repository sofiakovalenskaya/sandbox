<g id="notes" inkscape:groupmode="layer" inkscape:label="Размеры и сборка" font-family="DejaVu Sans, sans-serif"><text x="12" y="13" font-size="6.4" fill="#243241" font-weight="700" text-anchor="start">Развёртка коробки для дверного звонка</text>
<text x="12" y="21" font-size="3.55" fill="#6b4c19" font-weight="700" text-anchor="start">Примерочный макет в мм · Печать 100%</text>
<text x="12" y="28" font-size="3.25" fill="#243241" font-weight="400" text-anchor="start">Корпус 52 × 90 мм · Общая высота 117 мм · Картон 0,6 мм</text>
<text x="12" y="33.5" font-size="2.95" fill="#6b4c19" font-weight="400" text-anchor="start">Для примерки приняты глубина 32 мм, кнопка Ø30 мм и её центр в 102 мм от верха звонка.</text>
<text x="60.015" y="39" font-size="3.5" fill="#243241" font-weight="700" text-anchor="middle">A · Передняя панель</text>
<text x="174.045" y="39" font-size="3.5" fill="#243241" font-weight="700" text-anchor="middle">B · Задняя панель</text>
<text x="243.06" y="39" font-size="3.5" fill="#243241" font-weight="700" text-anchor="start">D · Нижняя лента</text>
<text x="60.015" y="149.1" font-size="3.3" fill="#243241" font-weight="400" text-anchor="middle">Ø32</text>
<text x="174.045" y="74" font-size="3.2" fill="#243241" font-weight="400" text-anchor="middle">Ширина у плечиков 58,2 мм</text>
<text x="174.045" y="83" font-size="3.2" fill="#243241" font-weight="400" text-anchor="middle">Глубина между сгибами 39,4 мм</text>
<text x="12" y="186.176" font-size="3.5" fill="#243241" font-weight="700" text-anchor="start">C · Верхняя и боковые стенки</text>
<text x="12" y="283" font-size="3.15" fill="#243241" font-weight="400" text-anchor="start">1  Замкните ленты C и D торцевыми клапанами.  2  Приклейте панель A к клапанам.</text>
<text x="12" y="289" font-size="3.15" fill="#243241" font-weight="400" text-anchor="start">3  Вставьте звонок сзади и совместите кнопку с окном.  4  Закрепите панель B на клапанах.</text>
<text x="347" y="283" font-size="3.2" fill="#af252d" font-weight="400" text-anchor="start">Рез</text>
<text x="382" y="283" font-size="3.2" fill="#155caf" font-weight="400" text-anchor="start">Сгиб</text>
