<title>Развёртка коробки дверного звонка</title>
<desc>Четыре детали. Передняя и задняя панели и две ленты стенок с клапанами. Габариты относятся к линиям сгиба. Размеры заданы для примерки. При резке выключите слои печати и пояснений. Панель B можно закрепить съёмными наклейками.</desc>
