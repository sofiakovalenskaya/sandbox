<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><title>Упаковка для 60 карт 69×94 мм с выступающим разделителем</title><desc>Размеры в миллиметрах. Две стопки по 30 карт по толщине. Корпус разделителя 69×94, центральный хвостик 18×14. Паз в верхней крышке 18.8×1.0, по центру глубины. Коробка по биговке 73×98×24. Глубина и материал предварительные: до производства измерить толщину 60 карт и выполнить бумажную примерку. Это новый параметрический проект по описанию, не восстановление исходного файла высечки.</desc><g id="CUT" fill="none" stroke="#D12F68" stroke-width=".2" stroke-linejoin="round" stroke-linecap="round"><path id="carton-outline" d="M 18 89 L 30 86 L 59.5 86 A 7 3.5 0 0 0 73.5 86 L 103 86 L 105 69.2 L 125 69.2 L 127 86 L 127 62 L 129 50 L 198 50 L 200 62 L 200 86 L 202 69.2 L 222 69.2 L 224 86 L 224 184 L 222 200.8 L 202 200.8 L 200 184 L 127 184 L 125 200.8 L 105 200.8 L 103 184 L 103 208 L 101 220 L 32 220 L 30 208 L 30 184 L 18 181 Z" /><rect id="lid-slot" x="154.1" y="73.5" width="18.8" height="1.0" rx="0.5" /><path id="divider-outline" d="M 257.0 90.0 H 282.5 V 76.0 H 300.5 V 90.0 H 326.0 V 184.0 H 257.0 Z" /></g><g id="SCORE" fill="none" stroke="#2369A5" stroke-width=".18" stroke-dasharray="1.5 1"><line x1="30.0" y1="86.0" x2="30.0" y2="184.0" /><line x1="103.0" y1="86.0" x2="103.0" y2="184.0" /><line x1="127.0" y1="86.0" x2="127.0" y2="184.0" /><line x1="200.0" y1="86.0" x2="200.0" y2="184.0" /><line x1="103.0" y1="86.0" x2="127.0" y2="86.0" /><line x1="200.0" y1="86.0" x2="224.0" y2="86.0" /><line x1="127.0" y1="86.0" x2="200.0" y2="86.0" /><line x1="103.0" y1="184.0" x2="127.0" y2="184.0" /><line x1="200.0" y1="184.0" x2="224.0" y2="184.0" /><line x1="30.0" y1="184.0" x2="103.0" y2="184.0" /><line x1="127.0" y1="62.0" x2="200.0" y2="62.0" /><line x1="30.0" y1="208.0" x2="103.0" y2="208.0" /></g></svg>